alignment:
  namespace: "CollatzTwoWindowChallenge"
  theorems:
    - name: "collatz_two_window_tight_094476_master"
      informal: >-
        Tight-slack 0.94476 four-part master bound (Draft 3 Theorem 1):
        parameterized by ThreePlaceSubspaceHypothesis (1/20000000) H_0 R with
        H_0 <= 2^((49597/100000) * 2^40), proves shellNeverDrops k <= 2^(0.94476 k)
        outside R bands [K_i, 3.041 K_i], N_T(X) <= 5 X^0.94476 for X >= 2^(2^41)
        outside [2^(K_i), (2^(K_i))^3.06], a good integer in every power window
        [X_1, X_1^(3.2^(R+1))], and eventual N_T(X) <= C X^0.94476.
    - name: "collatz_two_window_wide_0945_master"
      informal: >-
        Wide-slack 0.945 four-part master bound (Draft 3 Theorem 2) under
        ThreePlaceSubspaceHypothesis (1/20000) H_0 R via the 202-leaf BSP cover.
    - name: "all_shell_neverDrops_le"
      informal: >-
        Unconditional all-shell bound (Draft 3 Lemma 14): shellNeverDrops k <=
        2^(0.94995558 k) for every k >= 24.
    - name: "two_pow_mul_iterate"
      informal: >-
        Exact k-step shortcut affine formula (Draft 3 Lemma 10):
        2^k * T^[k] n = 3^(oddCount k n) * n + affineOffset k n.
    - name: "parityWord_bijective_shell"
      informal: >-
        Exact 2-adic parity-word bijection (Draft 3 Lemma 11) from the dyadic
        shell [2^k, 2^(k+1)) onto Fin k -> Bool.
    - name: "suffix_shifted_bernoulli_far_bound"
      informal: >-
        Shifted Bernoulli tree suffix far-pair bound (Draft 3 Lemma 12):
        sum of geometric-mean suffix tilted weights at Hamming distance >= H
        is at most (2 * sqrt(q * (1 - q)))^H.
    - name: "neverDrops_one"
      informal: "Non-vacuity sanity check: n = 1 has infinite stopping time."
    - name: "not_neverDrops_three"
      informal: "Non-vacuity sanity check: n = 3 has finite stopping time (T^[4] 3 = 2 < 3)."

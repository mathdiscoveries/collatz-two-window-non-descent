version: "v0.4"

project:
  name: "Classical 3x+1 Collatz Infinite Stopping Times: Two-Window Upper Bound N_T(X) = O(X^0.94476)"
  description: >-
    Lean 4 + Mathlib formalization proving the two-window ineffective upper
    bounds N_T(X) = O(X^0.94476) (via a 401-leaf decide +kernel BSP cover) and
    N_T(X) = O(X^0.945) (via a 202-leaf BSP cover) for the count N_T(X) of
    positive integers 1 <= n <= X with infinite stopping time under the
    shortcut Collatz map T(n) = n/2 (n even), (3n+1)/2 (n odd). Both four-part
    master theorems parameterize the quantitative three-place {infinity, 2, 3}
    Subspace Theorem explicitly via ThreePlaceSubspaceHypothesis (never
    axiomatized; instantiated outside Lean by Evertse and Ferretti 2013
    Theorem 3.1 with R < 10^58 tight and R < 10^43 wide). Also proves
    unconditionally the all-shell bound N_k <= 2^(0.94995558 k) for k >= 24,
    the exact k-step shortcut affine formula, the 2-adic shell parity-word
    bijection, and the shifted Bernoulli tree suffix coupling bound. Companion
    working draft and exact zero-float checker archive are published at
    https://mathdiscoveries.org/results/collatz-two-window-non-descent.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

